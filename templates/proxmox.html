<!DOCTYPE html>
<script>
function zeroLeakCleanup() {
  document.querySelectorAll('style[data-dynamic], link[data-dynamic], script[data-dynamic], button[data-dynamic], li[data-dynamic], .overlay[data-dynamic], .modal[data-dynamic]').forEach(el => {
    if (el.parentNode) el.parentNode.removeChild(el);
  });
  if (typeof proxmoxActive !== 'undefined') proxmoxActive = false;
}
window.addEventListener('beforeunload', zeroLeakCleanup);
document.addEventListener('visibilitychange', function() {
  if (document.hidden) {
    zeroLeakCleanup();
  } else {
    proxmoxActive = true;
    fetchStatus();
  }
});
</script>
<script>
// --- Leak Prevention: Cancel async operations and timeouts on unload ---
let proxmoxActive = true;
window.addEventListener('beforeunload', () => { proxmoxActive = false; });
// Example usage for fetch:
// fetch('/vm_status').then(resp => { if (!proxmoxActive) return; /* handle resp */ });
// For timeouts, store references and clear them on unload if needed.
</script>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no"/>
<title>VM Controls</title>
<style>
  /* Proxmox dark theme colors - more toned down */
  :root {
    --bg-primary: #1a1a1a;
    --text-primary: #d0d0d0;
    --text-secondary: #a0a0a0;
    --surface-primary: #2a2a2a;
    --surface-border: #404040;
    --button-bg: #2a2a2a;
    --button-border: #404040;
    --button-text: #d0d0d0;
    /* Button Colors - Proxmox style but more dimmed */
    --start-bg: #1a5a2a;
    --start-border: #134320;
    --start-text: #1a1a1a;
    --stop-bg: #8f252e;
    --stop-border: #7a1f26;
    --stop-text: #1a1a1a;
    --reset-bg: #b08505;
    --reset-border: #9a7200;
    --reset-text: #1a1a1a;
    --shutdown-bg: #4a5056;
    --shutdown-border: #3a4046;
    --shutdown-text: #1a1a1a;
    --reboot-bg: #004287;
    --reboot-border: #003570;
    --reboot-text: #1a1a1a;
  }
  
  html, body {
    margin: 0; padding: 0; 
    height: 100vh; height: 100dvh;
    width: 100vw;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    position: fixed;
    top: 0; left: 0;
    box-sizing: border-box;
  }
  #container {
    box-sizing: border-box;
    width: 100%;
    height: 85vh; /* Much smaller to ensure no overflow */
    margin: 0; 
    padding: 3px;
    display: grid;
    gap: 3px;
    overflow: hidden;
    align-items: stretch;
    position: absolute;
    top: 0; left: 0;
  }
  /* Portrait mode */
  @media (orientation: portrait) {
  /* portrait: use default container styling */
  }
  /* Landscape mode - dynamic grid with address bar consideration */
  @media (orientation: landscape) {
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      height: calc(var(--vh, 1vh) * 100);
      overflow: hidden;
    }
    #container {
      height: 100vh;
      height: calc(var(--vh, 1vh) * 100);
      padding: 3px;
      gap: 3px;
      overflow: hidden;
      box-sizing: border-box;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      grid-auto-rows: minmax(120px, auto);
      align-content: start;
    }
    .vm-block {
      height: auto;
      min-height: 120px;
      margin: 0;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
    }
    .button-grid {
      padding: 3px;
      gap: 3px !important;
    }
    .button-row {
      gap: 3px !important;
    }
    .vm-block .button-row {
      gap: 3px !important;
    }
    /* Keep the same button styling as portrait mode */
    .button-grid button {
      font-size: 36px;
      padding: 10px 6px;
      min-height: 0;
    }
    .vmstatus, .vm-title {
      font-size: 0.9rem;
      margin-bottom: 2px;
      line-height: 1.1;
    }
    .usage {
      font-size: 0.8rem;
      margin-top: 2px;
    }
  }
  .vm-block {
    background: var(--surface-primary);
    border: 1px solid var(--surface-border);
    border-radius: 12px;
    padding: 3px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    height: 100%;
    width: 100%;
    overflow: hidden;
  backdrop-filter: blur(10px);
  }
  .vmstatus {
    flex: 0 0 auto;
    font-weight: bold;
    font-size: 0.9rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
    padding: 0 5px;
    user-select: none;
  }
  .vm-title {
    font-weight: bold;
    font-size: 0.9rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 5px;
  }
  .usage {
    font-weight: normal;
    font-size: 0.8rem;
    color: var(--text-secondary);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    padding: 0 5px;
  }
  .button-grid {
    flex: 1 1 0;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: 1fr;
    gap: 2px;
    height: 100%;
    width: 100%;
    box-sizing: border-box;
    overflow: hidden;
  }
  /* Visibility rules driven by button-grid.running / .stopped classes */
  .button-grid.running .start { display: none !important; }
  .button-grid.running .shutdown,
  .button-grid.running .reboot,
  .button-grid.running .stop,
  .button-grid.running .reset { display: flex !important; }
  .button-grid.running .button-row { display: grid !important; grid-template-columns: 1fr 1fr; gap: 2px; height: 100%; }
  .button-grid.stopped .start { display: flex !important; }
  .button-grid.stopped .shutdown,
  .button-grid.stopped .reboot,
  .button-grid.stopped .stop,
  .button-grid.stopped .reset,
  .button-grid.stopped .button-row { display: none !important; }
  /* Explicit classes to control running vs stopped layout to avoid inline-style race conditions */
  .button-grid.running {
    display: grid !important;
    grid-template-columns: 1fr !important;
    grid-template-rows: repeat(3, 1fr) !important;
  }
  .button-grid.stopped {
    display: grid !important;
    grid-template-columns: 1fr !important;
    grid-template-rows: 1fr !important;
  }
  /* When two-row-layout is used (no reboot button) we want a simple column flex layout */
  .button-grid.two-row-layout.running {
    display: flex !important;
    flex-direction: column !important;
  }
  .button-row {
    display: grid;
    gap: 2px;
    height: 100%;
    width: 100%;
  }
  button {
    background: var(--button-bg);
    color: var(--button-text);
    border: 1px solid var(--button-border);
    border-radius: 12px;
    cursor: pointer;
    font-size: 36px;
    font-weight: 600;
    width: 100%;
    min-height: 0;
    min-width: 0;
    height: 100%;
    padding: 10px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    white-space: nowrap;
    user-select: none;
   /* avoid transitioning height/width to prevent half-size flashes during layout changes
     only animate non-layout properties */
   transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
  }
  @media (hover: hover) {
    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.5);
      filter: brightness(1.15);
    }
  }
  button:active {
    transform: translateY(-1px);
    box-shadow: 0 3px 8px rgba(0,0,0,0.4);
  }
  button.start { 
    background: var(--start-bg);
    border: 1px solid var(--start-border);
    color: var(--start-text);
  }
  button.stop { 
    background: var(--stop-bg);
    border: 1px solid var(--stop-border);
    color: var(--stop-text);
  }
  button.reset { 
    background: var(--reset-bg);
    border: 1px solid var(--reset-border);
    color: var(--reset-text);
  }
  button.shutdown { 
    background: var(--shutdown-bg);
    border: 1px solid var(--shutdown-border);
    color: var(--shutdown-text);
  }
  button.reboot { 
    background: var(--reboot-bg);
    border: 1px solid var(--reboot-border);
    color: var(--reboot-text);
  }
  button span {
    font-size: 36px;
    font-weight: 700;
    text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    margin-top: 4px;
    letter-spacing: 0.5px;
  }
  .icon {
    width: 60px;
    height: 60px;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4));
    color: inherit; /* Ensure icons inherit button text color */
  }
  
  /* Landscape mode optimizations - Mobile phones */
  @media (orientation: landscape) and (max-height: 600px) {
    .vm-block {
      padding: 1px;
    }
    .vmstatus {
      font-size: 0.75rem;
      margin-bottom: 1px;
    }
    .usage {
      font-size: 0.65rem;
    }
    
    /* Force equal height for all button rows */
    .button-grid {
      gap: 1px;
    }
    
    /* Make all buttons same height by using flexbox */
    .button-grid[style*="repeat(3, 1fr)"] {
      display: flex !important;
      flex-direction: column !important;
      height: 100% !important;
    }
    
    .button-grid[style*="repeat(3, 1fr)"] > button,
    .button-grid[style*="repeat(3, 1fr)"] > .button-row {
      flex: 1 !important;
      height: auto !important;
      min-height: 0 !important;
    }
    
    /* Layout rules for 2-row grid (when reboot is hidden) - both orientations */
    .vm-block .button-grid.two-row-layout {
      display: flex !important;
      flex-direction: column !important;
      height: 100% !important;
      grid-template-rows: none !important;
    }
    
    .vm-block .button-grid.two-row-layout > button,
    .vm-block .button-grid.two-row-layout > .button-row {
      flex: 1 !important;
      height: auto !important;
      min-height: 0 !important;
    }
    
    /* Ensure two-row layout works in portrait mode with higher specificity */
    @media (orientation: portrait) {
      .vm-block .button-grid.two-row-layout {
        display: flex !important;
        flex-direction: column !important;
        height: 100% !important;
        grid-template-rows: none !important;
      }
      
      .vm-block .button-grid.two-row-layout > button,
      .vm-block .button-grid.two-row-layout > .button-row {
        flex: 1 !important;
        height: auto !important;
        min-height: 0 !important;
      }
    }
    
    .button-row {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 1px !important;
    }
    
    button {
      padding: 2px 4px !important;
      gap: 1px !important;
      font-size: 16px !important;
      min-height: 0 !important;
      height: 100% !important;
    }
    
    button span {
      font-size: 16px !important;
      margin-top: 1px !important;
    }
    
    .icon {
      width: 32px !important;
      height: 32px !important;
    }
  }
  
  /* Very small screens */
  @media (max-width: 480px) {
    button span {
      font-size: 18px;
    }
    .icon {
      width: 36px;
      height: 36px;
    }
    button {
      padding: 6px 4px;
      gap: 4px;
    }
  }

  /* Portrait mobile: force column flex layout for running grids so buttons are equal height */
  @media (orientation: portrait) and (max-width: 900px) {
    .vm-block .button-grid.running,
    .vm-block .button-grid.two-row-layout.running {
      display: flex !important;
      flex-direction: column !important;
      height: 100% !important;
    }
    .vm-block .button-grid.running > button,
    .vm-block .button-grid.running > .button-row,
    .vm-block .button-grid.two-row-layout.running > button,
    .vm-block .button-grid.two-row-layout.running > .button-row {
      flex: 1 1 0 !important;
      height: auto !important;
      min-height: 0 !important;
      box-sizing: border-box;
    }
    /* ensure two-column rows inside a button-row layout behave correctly */
    .vm-block .button-row {
      display: flex !important;
      flex-direction: row !important;
      gap: 6px !important;
    }
    .vm-block .button-row > button {
      flex: 1 1 0 !important;
      height: auto !important;
    }
  }
  /* Ensure consistent button heights across grid and flex layouts */
  .button-grid {
    /* make new rows default to equal fraction heights */
    grid-auto-rows: 1fr;
  }
  .button-grid > button,
  .button-grid > .button-row,
  .button-row > button {
    height: 100% !important;
    min-height: 0 !important;
    box-sizing: border-box;
  }
  /* When using the two-row layout, enforce a 2-row grid so top and bottom share equal height */
  .button-grid.two-row-layout.running {
    display: grid !important;
    grid-template-rows: 1fr 1fr !important;
    height: 100% !important;
  }
  .button-grid.two-row-layout.running > button,
  .button-grid.two-row-layout.running > .button-row {
    height: 100% !important;
    min-height: 0 !important;
    box-sizing: border-box;
  }
  /* When only a single VM is shown, prefer a stable flex column for running state
     to avoid layout changes when the Start button is hidden and other buttons show. */
  #container.single-vm .vm-block .button-grid.running,
  #container.single-vm .vm-block .button-grid.two-row-layout.running {
    display: flex !important;
    flex-direction: column !important;
    height: 100% !important;
  }
  #container.single-vm .vm-block .button-grid.running > button,
  #container.single-vm .vm-block .button-grid.running > .button-row,
  #container.single-vm .vm-block .button-grid.two-row-layout.running > button,
  #container.single-vm .vm-block .button-grid.two-row-layout.running > .button-row {
    flex: 1 1 0 !important;
    height: auto !important;
    min-height: 0 !important;
    box-sizing: border-box;
  }
</style>
</head>
<body>
<div id="container" role="main" aria-label="Proxmox VM Controls">
  {% for vm in vms %}
  <section class="vm-block" id="vm-{{ vm.vmid }}" aria-labelledby="vm-label-{{ vm.vmid }}">
    <div id="vm-label-{{ vm.vmid }}" class="vmstatus" aria-live="polite">
      <div class="vm-title">{{ vm.name }} ({{ vm.vmid }})</div>
      {% if vm.status == 'running' and vm.ram_gb is not none and vm.cpu_percent is not none %}
        <div class="usage">{{ vm.cpu_percent }}% CPU {{ vm.ram_gb }}GB RAM</div>
      {% elif vm.status == 'stopped' %}
        <div class="usage">Stopped</div>
      {% endif %}
    </div>
    <div class="button-grid {% if vm.status == 'running' and hide_reboot %}two-row-layout running{% elif vm.status == 'running' %}running{% else %}stopped{% endif %}">
  <button id="start-{{ vm.vmid }}" class="start" onclick="confirmAction({{ vm.vmid }}, 'start')" aria-label="Start VM {{ vm.vmid }}">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
  <span>Start</span>
      </button>
  <button id="shutdown-{{ vm.vmid }}" class="shutdown" onclick="confirmAction({{ vm.vmid }}, 'shutdown')" aria-label="Shutdown VM {{ vm.vmid }}" {% if vm.status == 'running' and hide_reboot %}style="flex:1; height:auto;"{% endif %}>
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16.56 5.44L15.11 6.89C16.84 7.94 18 9.83 18 12A6 6 0 0 1 6 12C6 9.83 7.16 7.94 8.88 6.88L7.44 5.44C5.36 6.88 4 9.28 4 12A8 8 0 0 0 20 12C20 9.28 18.64 6.88 16.56 5.44M13 3H11V13H13"/>
        </svg>
        <span>Shutdown</span>
      </button>
    {% if not hide_reboot %}
  <button id="reboot-{{ vm.vmid }}" class="reboot" onclick="confirmAction({{ vm.vmid }}, 'reboot')" aria-label="Reboot VM {{ vm.vmid }}">
        <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8c-.45-.83-.7-1.79-.7-2.8 0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/>
        </svg>
        <span>Reboot</span>
      </button>
      {% endif %}
  <div class="button-row" {% if vm.status == 'running' %}style="display: grid;"{% else %}style="display: none;"{% endif %} >
  <button id="stop-{{ vm.vmid }}" class="stop" onclick="confirmAction({{ vm.vmid }}, 'stop')" aria-label="Stop VM {{ vm.vmid }}" style="height: 100%;">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h12v12H6z"/>
          </svg>
          <span>Stop</span>
        </button>
  <button id="reset-{{ vm.vmid }}" class="reset" onclick="confirmAction({{ vm.vmid }}, 'restart')" aria-label="Reset VM {{ vm.vmid }}" style="height: 100%;">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
          </svg>
          <span>Reset</span>
        </button>
      </div>
    </div>
  </section>
  {% endfor %}
</div>
<!-- Output Display -->
<div class="vm-output" id="vmOutput">
  <button class="close-btn" onclick="closeVMOutput()">&times;</button>
  <pre id="vmOutputContent"></pre>
</div>
<style>
  .vm-output {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--surface-primary);
    border: 1px solid var(--surface-border);
    border-radius: 10px;
    padding: 16px 32px 16px 16px;
    max-width: 350px;
    z-index: 1000;
    color: var(--text-primary);
    font-size: 1rem;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    display: none;
  }
  .vm-output.show {
    display: block;
  }
  .vm-output .close-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    background: none;
    border: none;
    color: var(--text-secondary);
    font-size: 1.2rem;
    cursor: pointer;
  }
  .vm-output pre {
    margin: 0;
    white-space: pre-wrap;
    font-family: inherit;
  }
</style>
<script>
function showVMOutput(msg, success=true) {
  const outputDiv = document.getElementById('vmOutput');
  const contentPre = document.getElementById('vmOutputContent');
  contentPre.textContent = msg;
  outputDiv.classList.add('show');
  outputDiv.style.borderColor = success ? '#1a5a2a' : '#8f252e';
  setTimeout(() => {
    outputDiv.classList.remove('show');
  }, 2000);
}
function closeVMOutput() {
  document.getElementById('vmOutput').classList.remove('show');
}
// Fix viewport height for mobile browsers and set dynamic grid
function setViewportHeight() {
  const vh = window.innerHeight * 0.01;
  document.documentElement.style.setProperty('--vh', `${vh}px`);
  const container = document.getElementById('container');
  if (container) {
    container.style.height = `${window.innerHeight - 4}px`; // Account for padding
    setOptimalGrid();
  }
}

function setOptimalGrid() {
  const container = document.getElementById('container');
  const vmBlocks = document.querySelectorAll('.vm-block');
  const vmCount = vmBlocks.length;
  
  if (!container || vmCount === 0) return;
  
  const isPortrait = window.innerHeight > window.innerWidth;
  let cols, rows;
  
  if (vmCount === 1) {
    cols = 1; rows = 1;
  } else if (vmCount === 2) {
    cols = isPortrait ? 1 : 2;
    rows = isPortrait ? 2 : 1;
  } else if (vmCount === 3) {
    cols = isPortrait ? 1 : 2;
    rows = isPortrait ? 3 : 2;
  } else if (vmCount === 4) {
    cols = 2; rows = 2;
  } else if (vmCount <= 6) {
    cols = isPortrait ? 2 : 3;
    rows = Math.ceil(vmCount / cols);
  } else {
    cols = isPortrait ? 2 : 3;
    rows = Math.ceil(vmCount / cols);
  }
  
  container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  container.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  // mark single-vm so CSS can prefer a flex column layout for running state
  try {
    if (vmCount === 1) container.classList.add('single-vm'); else container.classList.remove('single-vm');
  } catch (e) {}
}

setViewportHeight();
window.addEventListener('resize', setViewportHeight);
window.addEventListener('orientationchange', () => {
  setTimeout(setViewportHeight, 100); // Delay for orientation change
});

// Render shy as a JS boolean using Jinja
const shy = {{ 'true' if shy else 'false' }};
function confirmAction(vmid, action) {
  console.log('confirmAction called', {vmid: vmid, action: action, shy: shy});
  if (shy && !confirm(`Are you sure you want to ${action} VM ${vmid}?`)) return;
  sendCommand(vmid, action);
}
function sendCommand(vmid, action) {
  console.log('sendCommand called', {vmid: vmid, action: action});
  fetch('/vm/' + vmid + '/' + action, { method: 'POST' })
    .then(res => res.json())
    .then(data => {
      if (!proxmoxActive) return;
      if (data.status === 'success') {
        showVMOutput(`Command sent to VM ${data.vmid}: ${data.action}`, true);
        // no local UI changes here; /vm_status will update the controls
      } else {
  showVMOutput(`Error: ${data.message || 'Unknown error'}`, false);
      }
    })
    .catch(err => {
      if (!proxmoxActive) return;
  showVMOutput('Error: ' + err, false);
    });
}
function updateVMStatus(statuses) {
  if (!proxmoxActive) return;
  statuses.forEach(vm => {
    const vmBlock = document.getElementById('vm-' + vm.vmid);
    // Update status text in the vmstatus div
    if (vmBlock) {
      let usageEl = vmBlock.querySelector('.usage');
      if (vm.status === 'running' && vm.ram_gb !== null && vm.cpu_percent !== null) {
        if (!usageEl) {
          usageEl = document.createElement('div');
          usageEl.className = 'usage';
          vmBlock.querySelector('.vmstatus').appendChild(usageEl);
        }
        usageEl.textContent = `${vm.cpu_percent}% CPU ${vm.ram_gb}GB RAM`;
      } else if (vm.status === 'stopped') {
        if (!usageEl) {
          usageEl = document.createElement('div');
          usageEl.className = 'usage';
          vmBlock.querySelector('.vmstatus').appendChild(usageEl);
        }
        usageEl.textContent = 'Stopped';
      } else {
        if (usageEl) usageEl.remove();
      }
    }

    // Buttons and grid follow the reported VM status exactly
    const buttonGrid = document.querySelector(`#vm-${vm.vmid} .button-grid`);
    if (vm.status === 'running') {
      if (buttonGrid) {
        buttonGrid.classList.add('running');
        buttonGrid.classList.remove('stopped');
        if (buttonGrid.classList.contains('two-row-layout')) {
          buttonGrid.style.display = 'grid';
          buttonGrid.style.gridTemplateColumns = '1fr';
          buttonGrid.style.gridTemplateRows = '1fr 1fr';
        } else {
          buttonGrid.style.display = 'grid';
          buttonGrid.style.gridTemplateColumns = '1fr';
          buttonGrid.style.gridTemplateRows = 'repeat(3, 1fr)';
        }
      }
    } else {
      if (buttonGrid) {
        buttonGrid.classList.add('stopped');
        buttonGrid.classList.remove('running');
        buttonGrid.style.display = 'grid';
        buttonGrid.style.gridTemplateColumns = '1fr';
        buttonGrid.style.gridTemplateRows = '1fr';
      }
    }
  // Ensure buttons are enabled
  const buttons = document.querySelectorAll(`#vm-${vm.vmid} button`);
  buttons.forEach(b => { b.disabled = false; });
    // force reflow to stabilize layout
    if (vmBlock) { const _ = vmBlock.getBoundingClientRect(); }
  });
}

// Set initial button states based on current VM status
function setInitialButtonStates() {
  const vmBlocks = document.querySelectorAll('.vm-block');
  vmBlocks.forEach(vmBlock => {
    const vmId = vmBlock.id.replace('vm-', '');
    const usageEl = vmBlock.querySelector('.usage');
    // Check if VM is running by looking for CPU/RAM info or if usage doesn't say "Stopped"
    const isRunning = usageEl && usageEl.textContent.includes('CPU') && usageEl.textContent.includes('RAM');
    
    const startBtn = document.getElementById('start-' + vmId);
    const shutdownBtn = document.getElementById('shutdown-' + vmId);
    const rebootBtn = document.getElementById('reboot-' + vmId);
    const stopBtn = document.getElementById('stop-' + vmId);
    const resetBtn = document.getElementById('reset-' + vmId);
    const buttonGrid = vmBlock.querySelector('.button-grid');
    const buttonRow = vmBlock.querySelector('.button-row');

    if (isRunning) {
        if (buttonGrid) {
          buttonGrid.classList.add('running');
          buttonGrid.classList.remove('stopped');
          // Explicitly set rows to avoid layout shifts on first paint
          buttonGrid.style.display = 'grid';
          buttonGrid.style.gridTemplateColumns = '1fr';
          buttonGrid.style.gridTemplateRows = 'repeat(3, 1fr)';
          // force reflow so heights are computed correctly without hiding the element
          // eslint-disable-next-line no-unused-vars
          const _ = vmBlock.getBoundingClientRect();
        }
    } else {
        if (buttonGrid) {
          buttonGrid.classList.add('stopped');
          buttonGrid.classList.remove('running');
          buttonGrid.style.display = 'grid';
          buttonGrid.style.gridTemplateColumns = '1fr';
          buttonGrid.style.gridTemplateRows = '1fr';
          // force a reflow without toggling visibility
          // eslint-disable-next-line no-unused-vars
          const _ = vmBlock.getBoundingClientRect();
        }
    }
  });
}
function fetchStatus() {
  if (!proxmoxActive) return;
  fetch('/vm_status')
    .then(res => {
      if (!res.ok) throw new Error('Network response was not ok');
      return res.json();
    })
    .then(data => {
      // Check if the number of VMs changed (indicating VMs were hidden/shown due to SAME_RESOURCES)
      const currentVMCount = document.querySelectorAll('.vm-block').length;
      const newVMCount = data.length;
      
      if (currentVMCount !== newVMCount) {
        // VM list changed due to resource sharing logic, refresh the page
        window.location.reload();
        return;
      }
      
      // Check if any VM IDs are different (new VMs appeared or disappeared)
      const currentVMIds = Array.from(document.querySelectorAll('.vm-block')).map(block => 
        parseInt(block.id.replace('vm-', ''))
      ).sort();
      const newVMIds = data.map(vm => vm.vmid).sort();
      
      if (JSON.stringify(currentVMIds) !== JSON.stringify(newVMIds)) {
        window.location.reload();
        return;
      }
      
      // If VM count and IDs are the same, just update statuses
      updateVMStatus(data);
    })
    .catch(err => {
      console.error('Error fetching VM status:', err);
    });
}

// Initialize everything when page loads
setInitialButtonStates();
fetchStatus();
const intervals = [setInterval(fetchStatus, 3000)];
window.addEventListener('beforeunload', () => { intervals.forEach(clearInterval); });
window.addEventListener('message', e => {
    if (e.data === 'proxpad-pause') {
        proxmoxActive = false;
        intervals.forEach(clearInterval);
    }
    if (e.data === 'proxpad-resume') {
        proxmoxActive = true;
        intervals.forEach(clearInterval);
        intervals.length = 0;
        intervals.push(setInterval(fetchStatus, 3000));
        fetchStatus();
    }
});
</script>
<script>
  // notify parent of activity to reset screensaver
  function postActivity(){ try{ parent.postMessage('proxpad-activity', '*'); }catch(e){} }
  ['click','touchstart','keydown','mousemove'].forEach(e=>window.addEventListener(e, postActivity, {passive:true}));
  window.addEventListener('load', postActivity);
</script>
<script>
  // Signal parent when VM control buttons are tapped
  document.addEventListener('DOMContentLoaded', ()=>{
    document.querySelectorAll('#container button, .button-grid button, .nav-link, button.nav-link').forEach(b=>{
      b.addEventListener('pointerdown', (ev)=>{ try{ if (ev && ev.pointerType==='touch') parent.postMessage({ proxpad: 'button-press' }, '*'); }catch(e){} }, {passive:true});
    });
  });
</script>
