    <script>
    // --- Universal Zero-Leak Cleanup Routine ---
    function zeroLeakCleanup() {
        document.querySelectorAll('style[id^="screensaver-style"], style[data-dynamic], link[data-dynamic], script[data-dynamic], button[data-dynamic], li[data-dynamic], .overlay[data-dynamic], .modal[data-dynamic]').forEach(el => {
            if (el.parentNode) el.parentNode.removeChild(el);
        });
        if (typeof clockInterval !== 'undefined' && clockInterval) { clearInterval(clockInterval); clockInterval = null; }
        if (typeof moveTimer !== 'undefined' && moveTimer) { clearTimeout(moveTimer); moveTimer = null; }
        if (typeof timer !== 'undefined' && timer) { clearTimeout(timer); timer = null; }
        if (typeof macroActive !== 'undefined') macroActive = false;
        if (typeof mediaActive !== 'undefined') mediaActive = false;
        if (typeof proxmoxActive !== 'undefined') proxmoxActive = false;
    }
    window.addEventListener('beforeunload', zeroLeakCleanup);
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) zeroLeakCleanup();
    });
    // --- Aggressive DOM and Listener Cleanup ---
    function cleanupDynamicElements() {
        document.querySelectorAll('style[id^="screensaver-style"], style[data-dynamic]').forEach(style => {
            if (style.parentNode) style.parentNode.removeChild(style);
        });
        document.querySelectorAll('link[data-dynamic]').forEach(link => {
            if (link.parentNode) link.parentNode.removeChild(link);
        });
        document.querySelectorAll('button[data-dynamic]').forEach(btn => {
            btn.replaceWith();
        });
        document.querySelectorAll('li[data-dynamic]').forEach(li => {
            li.replaceWith();
        });
    }
    window.addEventListener('beforeunload', cleanupDynamicElements);
    document.addEventListener('visibilitychange', function() {
        if (document.hidden) cleanupDynamicElements();
    });
    // If you have tab switching logic, call cleanupDynamicElements() before switching tabs
    </script>
    <style>
        /* Proxmox dark theme colors */
        :root {
            --bg-primary: #1a1a1a;
            --text-primary: #d0d0d0;
            --text-secondary: #a0a0a0;
            --surface-primary: #2a2a2a;
            --surface-border: #404040;
            --tab-bg: #2a2a2a;
            --tab-border: #404040;
            --tab-active-bg: #1a5a2a;
            --tab-active-border: #134320;
            --tab-hover-bg: #3a3a3a;
        }

        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .container-fluid {
            height: 100vh;
            height: 100dvh;
            padding: 0;
            overflow: hidden;
        }

        /* Tab Navigation */
        .nav-tabs {
            background: var(--surface-primary);
            border-bottom: 1px solid var(--surface-border);
            margin: 0;
            flex-shrink: 0;
            border-radius: 0;
        }

        .nav-tabs .nav-link {
            background: var(--tab-bg);
            color: var(--text-primary);
            border: 1px solid var(--tab-border);
            border-bottom: none;
            margin-right: 0;
            margin-bottom: -1px;
            padding: 12px 20px;
            font-weight: 500;
            transition: all 0.3s ease;
            border-radius: 0;
            position: relative;
        }

        .nav-tabs .nav-link:hover {
            background: var(--tab-hover-bg);
            color: var(--text-primary);
            border-color: var(--surface-border);
        }

        .nav-tabs .nav-link.active {
            background: var(--tab-active-bg);
            color: var(--text-primary);
            border-color: var(--tab-active-border);
            border-bottom: 1px solid var(--tab-active-bg);
            z-index: 1;
        }

        /* Main content area */
        .tab-content {
            flex: 1;
            overflow: hidden;
            background: var(--bg-primary);
        }

        .tab-pane {
            height: 100%;
            overflow: hidden;
        }

        .content-frame {
            width: 100%;
            height: 100%;
            border: none;
            background: var(--bg-primary);
        }

        /* Portrait mode - horizontal tabs on top */
        @media (orientation: portrait) {
            .container-fluid {
                display: flex;
                flex-direction: column;
            }

            .nav-tabs {
                display: flex;
                flex-direction: row;
                width: 100%;
                justify-content: stretch;
                padding: 0;
                border-bottom: 1px solid var(--surface-border);
            }

            .nav-tabs .nav-item {
                flex: 1;
            }

            .nav-tabs .nav-link {
                margin: 0;
                border-radius: 0;
                border-right: 1px solid var(--tab-border);
                border-bottom: none;
                text-align: center;
                width: 100%;
            }

            .nav-tabs .nav-item:last-child .nav-link {
                border-right: none;
            }

            .nav-tabs .nav-link.active {
                border-bottom: 1px solid var(--tab-active-bg);
            }
        }

        /* Landscape mode - will be set by JavaScript */
        @media (orientation: landscape) {
            body {
                overflow: hidden;
            }
            
            .container-fluid.tabs-right {
                display: flex;
                flex-direction: row-reverse;
                height: 100vh;
                height: calc(var(--vh, 1vh) * 100);
                overflow: hidden;
            }
            
            .container-fluid.tabs-left {
                display: flex;
                flex-direction: row;
                height: 100vh;
                height: calc(var(--vh, 1vh) * 100);
                overflow: hidden;
            }

            .tabs-right .nav-tabs,
            .tabs-left .nav-tabs {
                flex-direction: column;
                border-bottom: none;
                width: 60px;
                min-width: 60px;
                max-width: 60px;
                height: 100vh;
                height: calc(var(--vh, 1vh) * 100);
                flex-shrink: 0;
                display: flex;
                padding: 0;
                margin: 0;
            }
            
            .tabs-right .nav-tabs .nav-item,
            .tabs-left .nav-tabs .nav-item {
                flex: 1;
                height: calc(var(--vh, 1vh) * 100 / 3);
                display: flex;
                margin: 0;
                padding: 0;
            }
            
            .tabs-right .nav-tabs {
                border-left: 1px solid #dee2e6;
            }
            
            .tabs-left .nav-tabs {
                border-right: 1px solid #dee2e6;
            }

            .tabs-right .nav-tabs .nav-link,
            .tabs-left .nav-tabs .nav-link {
                border-bottom: 1px solid #dee2e6;
                margin: 0;
                padding: 0.2rem;
                height: 100%;
                width: 60px;
                display: flex;
                align-items: center;
                justify-content: center;
                text-align: center;
                font-size: 0.7rem;
                writing-mode: horizontal-tb;
            }

            .tabs-right .nav-tabs .nav-link {
                border-left: none;
                border-radius: 0 0.25rem 0.25rem 0;
                margin-left: -1px;
            }
            
            .tabs-left .nav-tabs .nav-link {
                border-right: none;
                border-radius: 0.25rem 0 0 0.25rem;
                margin-right: -1px;
            }

            .tabs-right .nav-tabs .nav-link.active {
                border-left-color: transparent;
            }
            
            .tabs-left .nav-tabs .nav-link.active {
                border-right-color: transparent;
            }

            .tabs-right .tab-content {
                flex: 1;
                border-right: 1px solid #dee2e6;
                margin-right: -1px;
                height: 100vh;
                height: calc(var(--vh, 1vh) * 100);
                overflow: hidden;
            }
            
            .tabs-left .tab-content {
                flex: 1;
                border-left: 1px solid #dee2e6;
                margin-left: -1px;
                height: 100vh;
                height: calc(var(--vh, 1vh) * 100);
                overflow: hidden;
            }
            
            .tab-pane iframe {
                width: 100%;
                height: 100vh;
                height: calc(var(--vh, 1vh) * 100);
                border: none;
            }
        }        /* Popup notification overlay */
        #popup-container {
            position: fixed;
            inset: 0;
            z-index: 100000;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .popup-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.55);
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .popup-overlay.visible {
            opacity: 1;
        }
        .popup-overlay.hiding {
            opacity: 0;
        }
        .popup-card {
            background: var(--surface-primary);
            border: 1px solid var(--surface-border);
            border-radius: 20px;
            padding: 36px 40px;
            max-width: 85%;
            text-align: center;
            box-shadow: 0 12px 48px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .popup-icon {
            width: 64px;
            height: 64px;
            object-fit: contain;
        }
        .popup-icon.bi {
            font-size: 64px;
            color: var(--text-primary);
        }
        .popup-text {
            font-size: 20px;
            color: var(--text-primary);
            line-height: 1.4;
            word-break: break-word;
        }
        .popup-hint {
            font-size: 13px;
            color: var(--text-secondary);
            opacity: 0.7;
        }
        /* Loading indicator */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            font-size: 1.2rem;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <!-- Tab Navigation -->
    <ul class="nav nav-tabs" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="proxmox-tab" data-bs-toggle="tab" data-bs-target="#proxmox" type="button" role="tab" aria-controls="proxmox" aria-selected="true">
                    VMs
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="media-tab" data-bs-toggle="tab" data-bs-target="#media" type="button" role="tab" aria-controls="media" aria-selected="false">
                    Media
                </button>
            </li>
            {% for page in macro_pages %}
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="{{ page.id }}-tab" data-bs-toggle="tab" data-bs-target="#{{ page.id }}" type="button" role="tab" aria-controls="{{ page.id }}" aria-selected="false">
                    {{ page.name }}
                </button>
            </li>
            {% endfor %}
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="mainTabContent">
            <!-- Proxmox Tab -->
            <div class="tab-pane fade show active" id="proxmox" role="tabpanel" aria-labelledby="proxmox-tab">

                <iframe src="/proxmox" class="content-frame" title="Proxmox Controls"></iframe>
                {% else %}

                    <h4>No VM data available</h4>
                    <p>Proxmox integration is disabled. VM controls and stats are not available.</p>
                </div>
                {% endif %}
            </div>

            <!-- Media Tab -->

                <iframe src="/media" class="content-frame" title="Media Controls"></iframe>

            {% for page in macro_pages %}

    <!-- Screensaver overlay -->
    <div id="screensaver" aria-hidden="true" role="dialog" tabindex="-1">
        <div id="screensaver-clock" aria-label="Screensaver clock" role="button" tabindex="0"></div>
    </div>

    <!-- Popup notification container -->
    <div id="popup-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Apply tab positioning based on config
    const TABS_RIGHT = {{ config.TABS_RIGHT|tojson }};
        const container = document.querySelector('.container-fluid');
        
        function applyTabPosition() {
            container.classList.remove('tabs-left', 'tabs-right');
            if (TABS_RIGHT) {
                container.classList.add('tabs-right');
            } else {
                container.classList.add('tabs-left');
            }
        }

        // Apply immediately
        applyTabPosition();

        // Handle viewport height for mobile browsers
        function setViewportHeight() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }

        setViewportHeight();
        window.addEventListener('resize', setViewportHeight);
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                setViewportHeight();
                applyTabPosition();
            }, 100);
        });

        // Only reload VM iframe on tab switch, others load once
        document.addEventListener('DOMContentLoaded', function() {
            const tabTriggerList = [].slice.call(document.querySelectorAll('#mainTabs button[data-bs-toggle="tab"]'));
            tabTriggerList.forEach(function (tabTrigger) {
                tabTrigger.addEventListener('show.bs.tab', function (event) {
                    // Pause all iframe activity except the one we're navigating to
                    const targetPane = document.querySelector(event.target.getAttribute('data-bs-target'));
                    document.querySelectorAll('.content-frame').forEach(iframe => {
                        if (!targetPane.contains(iframe)) {
                            try { iframe.contentWindow.postMessage('proxpad-pause', '*'); } catch(e) {}
                        }
                    });
                    // Resume the target iframe
                    const targetIframe = targetPane.querySelector('.content-frame');
                    if (targetIframe) {
                        try { targetIframe.contentWindow.postMessage('proxpad-resume', '*'); } catch(e) {}
                    }
                    // Clean up timers and listeners aggressively on tab switch
                    if (window.timer) { clearTimeout(window.timer); window.timer = null; }
                    if (window.mainInterval) { clearInterval(window.mainInterval); window.mainInterval = null; }
                    if (window.moveTimer) { clearTimeout(window.moveTimer); window.moveTimer = null; }
                    if (window.throttledReset) {
                        ['mousemove','mousedown','keydown','touchstart','scroll'].forEach(evt => {
                            window.removeEventListener(evt, window.throttledReset, {passive:true});
                        });
                    }
                    // Remove screensaver style node if present
                    var style = document.getElementById('screensaver-style');
                    if (style && style.parentNode) { style.parentNode.removeChild(style); }
                    // Only reload VM iframe
                    const iframe = targetPane.querySelector('.content-frame');
                    if (iframe && iframe.src && iframe.getAttribute('src') === '/proxmox') {
                        iframe.src = iframe.src;
                    }
                });
            });
        });

        // Throttle function for high-frequency events
        function throttle(fn, wait) {
            let last = 0;
            return function(...args) {
                const now = Date.now();
                if (now - last >= wait) {
                    last = now;
                    fn.apply(this, args);
                }
            };
        }
    // Cleanup timers and listeners on page unload
    window.addEventListener('beforeunload', function() {
        // Aggressive cleanup on page unload
        if (window.timer) { clearTimeout(window.timer); window.timer = null; console.log('[ProxPad Debug] Cleared timer (unload)'); }
        if (window.mainInterval) { clearInterval(window.mainInterval); window.mainInterval = null; console.log('[ProxPad Debug] Cleared mainInterval (unload)'); }
        if (window.moveTimer) { clearTimeout(window.moveTimer); window.moveTimer = null; console.log('[ProxPad Debug] Cleared moveTimer (unload)'); }
        if (window.throttledReset) {
            ['mousemove','mousedown','keydown','touchstart','scroll'].forEach(evt => {
                window.removeEventListener(evt, window.throttledReset, {passive:true});
                console.log(`[ProxPad Debug] Removed listener for ${evt} (unload)`);
            });
        }
        window.removeEventListener('message', window.screensaverMessageHandler, false);
        window.removeEventListener('message', window.activityMessageHandler, false);
        var style = document.getElementById('screensaver-style');
        if (style && style.parentNode) { style.parentNode.removeChild(style); console.log('[ProxPad Debug] Removed screensaver style node (unload)'); }
        // Debug info: log memory usage if available
        if (performance && performance.memory) {
            console.log('[ProxPad Debug] Memory usage (unload):', performance.memory);
        }
    });
    </script>
    <script>
    {% if config.VIBRATION %}
        (function(){
            if (!('vibrate' in navigator)) return;
            const T = {{ config.VIBRATION_MS|default(30)|tojson }};
            function v(){ try{ navigator.vibrate(T); }catch(e){} }

            document.addEventListener('DOMContentLoaded', () => {
                document.querySelectorAll('#mainTabs .nav-link').forEach(b=>{
                    b.addEventListener('pointerdown', (ev)=>{ try{ if (ev && ev.pointerType==='touch') v(); }catch(e){} }, {passive:true});
                });
            });

            window.addEventListener('message', (ev) => {
                try {
                    const d = ev && ev.data;
                    if (!d) return;
                    if (d.proxpad === 'button-press') {
                        v();
                    }
                } catch (e) {}
            }, false);
        })();
    {% endif %}
    </script>
    <script>
    (function(){
    const SCREENSAVER_MINUTES = {{ config.SCREENSAVER|default(0)|tojson }};
    const SCREENSAVER_24H = {{ config.SCREENSAVER_24H|default(false)|tojson }};
    const SCREENSAVER_SECONDS = {{ config.SCREENSAVER_SECONDS|default(false)|tojson }};
    const SCREENSAVER_COLOR = {{ config.SCREENSAVER_COLOR|default('#ffffff')|tojson }};
    const SCREENSAVER_BLANK = {{ config.SCREENSAVER_BLANK|default(false)|tojson }};
        if (!SCREENSAVER_MINUTES || SCREENSAVER_MINUTES <= 0) return;

        const timeoutMs = SCREENSAVER_MINUTES * 60 * 1000;
        const screensaver = document.getElementById('screensaver');
        const clockEl = document.getElementById('screensaver-clock');
            let timer = null;
            let mainInterval = null;
            let moveTimer = null;
            let screensaverListenersAttached = false;
            let globalActivityListenersAttached = false;

            // Style node will be created only when screensaver is shown


            // movement interval in ms (slower, constant speed) - doubled per request
            const moveInterval = 30000;
            // delay before actually hiding the overlay to avoid click-through
            const dismissDelay = 400;
            // after hiding, keep blocking pointer events for a short cooldown to avoid delayed click-through
            const postHideCooldown = 350;

            function updateClock(){
                const now = new Date();
                // Build options depending on config
                const opts = { hour: '2-digit', minute: '2-digit', hour12: !SCREENSAVER_24H };
                if (SCREENSAVER_SECONDS) opts.second = '2-digit';
                clockEl.textContent = now.toLocaleTimeString([], opts);
            }

            function moveClock(){
                // Random position with margins while ensuring the clock stays fully on-screen
                const vw = window.innerWidth; const vh = window.innerHeight;
                const margin = 32;
                const cw = clockEl.offsetWidth || clockEl.getBoundingClientRect().width;
                const ch = clockEl.offsetHeight || clockEl.getBoundingClientRect().height;
                const minX = margin;
                const minY = margin;
                const maxX = Math.max(minX, vw - cw - margin);
                const maxY = Math.max(minY, vh - ch - margin);
                const x = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
                const y = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
                // enforce constant linear speed by setting transition duration to moveInterval
                clockEl.style.transition = `transform ${moveInterval/1000}s linear`;
                clockEl.style.transform = `translate(${x}px, ${y}px)`;
                moveTimer = setTimeout(moveClock, moveInterval);
            }

            // keyboard handler used only while screensaver active to prevent key events passing through
            function screensaverKeyHandler(e){
                if (!screensaver.classList.contains('active')) return;
                e.preventDefault(); e.stopPropagation();
                resetTimer(false);
                setTimeout(()=>{ hideScreensaver(); }, dismissDelay);
            }

            // pointer event handlers used to block interactions while screensaver is active
            function blockPointerEvent(e){
                // Allow events that originate on the screensaver overlay itself so overlay handlers can run.
                try {
                    if (e.target && e.target.closest && e.target.closest('#screensaver')) return;
                } catch(err) {}
                e.stopPropagation();
                e.preventDefault();
            }

            const appContainer = document.querySelector('.container-fluid');

            function showScreensaver(){
                // Create style node only when screensaver is shown
                let style = document.getElementById('screensaver-style');
                if (!style) {
                    style = document.createElement('style');
                    style.id = 'screensaver-style';
                    style.textContent = `
                        #screensaver{position:fixed;inset:0;background:#000;z-index:99999;display:none;pointer-events:auto;-webkit-tap-highlight-color:transparent}
                        #screensaver.active{display:block}
                        #screensaver:focus{outline:none}
                        #screensaver *{outline: none !important; box-shadow: none !important}
                        #screensaver-clock{position:absolute;left:0;top:0;color:rgba(255,255,255,0.98);font-size:48px;padding:8px 12px;background:rgba(0,0,0,0.35);border-radius:8px;will-change:transform;cursor:pointer;user-select:none}
                        @media(max-width:600px){ #screensaver-clock{font-size:26px;padding:6px 10px}}
                    `;
                    document.head.appendChild(style);
                }
                screensaver.classList.add('active');
                screensaver.setAttribute('aria-hidden','false');
                // Blur any focused element so it doesn't immediately receive the first click
                try { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); } catch(e){}
                // Focus the overlay so keyboard events can be captured
                try { screensaver.setAttribute('tabindex', '0'); screensaver.focus(); } catch(e){}

                if (SCREENSAVER_BLANK) {
                    // In blank mode, hide the clock and do not start movement
                    clockEl.style.display = 'none';
                } else {
                    clockEl.style.display = '';
                    // Apply configured color
                    try { clockEl.style.color = SCREENSAVER_COLOR; } catch(e){}
                    updateClock();
                    // Update interval depends on whether seconds are shown
                    clockInterval = setInterval(updateClock, SCREENSAVER_SECONDS ? 1000 : 60000);
                    // start movement loop
                    moveClock();
                }

                // Attach screensaver listeners only once
                if (!screensaverListenersAttached) {
                    window.addEventListener('keydown', screensaverKeyHandler, true);
                    ['pointerdown','pointerup','click','touchstart'].forEach(evt => window.addEventListener(evt, blockPointerEvent, true));
                    screensaverListenersAttached = true;
                }
                // Also disable pointer events on the main app container so underlying elements never receive events
                try { if (appContainer) appContainer.style.pointerEvents = 'none'; } catch(e){}
            }

            function hideScreensaver(){
                // remove visible overlay immediately
                screensaver.classList.remove('active');
                screensaver.setAttribute('aria-hidden','true');
                if (clockInterval) { clearInterval(clockInterval); clockInterval = null; }
                if (moveTimer) { clearTimeout(moveTimer); moveTimer = null; }
                // keep blocking pointer events for a short cooldown to catch delayed/tunneled events (Opera Mini, etc.)
                setTimeout(()=>{
                    // Remove screensaver listeners only if attached
                    if (screensaverListenersAttached) {
                        window.removeEventListener('keydown', screensaverKeyHandler, true);
                        ['pointerdown','pointerup','click','touchstart'].forEach(evt => window.removeEventListener(evt, blockPointerEvent, true));
                        screensaverListenersAttached = false;
                    }
                    // restore pointer events on main app container
                    try { if (appContainer) appContainer.style.pointerEvents = ''; } catch(e){}
                    // reset clock color
                    try { clockEl.style.color = ''; } catch(e){}
                }, postHideCooldown);
            }

            function resetTimer(immediateHide = true){
                // immediateHide=true will hide the screensaver immediately if active (normal activity)
                if (timer) clearTimeout(timer);
                timer = setTimeout(showScreensaver, timeoutMs);
                if (immediateHide && screensaver.classList.contains('active')) {
                    hideScreensaver();
                }
            }

            // Global activity listeners
            function attachGlobalActivityListeners() {
                if (globalActivityListenersAttached) return;
                ['mousemove','mousedown','keydown','touchstart','scroll'].forEach(evt => window.addEventListener(evt, resetTimer, {passive:true}));
                globalActivityListenersAttached = true;
            }
            function detachGlobalActivityListeners() {
                if (!globalActivityListenersAttached) return;
                ['mousemove','mousedown','keydown','touchstart','scroll'].forEach(evt => window.removeEventListener(evt, resetTimer, {passive:true}));
                globalActivityListenersAttached = false;
            }
            attachGlobalActivityListeners();

            // Listen for screensaver requests from iframes and other clients
            window.addEventListener('message', (ev)=>{
                try{
                    if (!ev || !ev.data) return;
                    if (ev.data === 'proxpad-screensaver') {
                        try{ showScreensaver(); }catch(e){}
                    }
                }catch(err){}
            }, false);

            // Listen to messages from iframes (they will post 'proxpad-activity')
            window.addEventListener('message', (ev)=>{
                if (!ev.data) return; if (ev.data === 'proxpad-activity') resetTimer();
            });

            // Capture all clicks on the overlay to prevent click-through and dismiss safely.
            function screensaverCaptureClick(e){
                // Always intercept and prevent propagation so underlying controls aren't activated
                e.stopPropagation(); e.preventDefault();
                resetTimer(false);
                setTimeout(()=>{ hideScreensaver(); }, dismissDelay);
            }
            // Use capture phase to ensure interception before underlying elements
            screensaver.addEventListener('click', screensaverCaptureClick, true);

            // Start timer
            resetTimer();

            // Keep timers accurate when viewport changes
            window.addEventListener('resize', ()=>{ if (screensaver.classList.contains('active')) moveClock(); });
        })();
    </script>
    <script>
    (function(){
        const POLL_MS = 2000;
        const DISMISS_MS = 10000;
        let popupQueue = [];
        let popupActive = false;
        let pollInterval = null;
        let popupTimers = {};
        window.active = true;
        window.addEventListener('beforeunload', () => { window.active = false; });

        function isUrl(s) {
            return /^(https?:\/\/|\/)/.test(s) || /\.(png|jpg|jpeg|gif|svg|webp)(\?|$)/i.test(s);
        }

        function createPopupEl(popup) {
            const overlay = document.createElement('div');
            overlay.className = 'popup-overlay';
            overlay.setAttribute('data-popup-id', popup.id);

            const card = document.createElement('div');
            card.className = 'popup-card';

            const icon = popup.icon || 'info-circle';
            if (isUrl(icon)) {
                const img = document.createElement('img');
                img.className = 'popup-icon';
                img.src = icon;
                img.alt = '';
                card.appendChild(img);
            } else {
                const i = document.createElement('i');
                i.className = 'popup-icon bi bi-' + icon;
                card.appendChild(i);
            }

            const text = document.createElement('div');
            text.className = 'popup-text';
            text.innerHTML = popup.text;
            card.appendChild(text);

            if (popup.keep) {
                const hint = document.createElement('div');
                hint.className = 'popup-hint';
                hint.textContent = 'tap to dismiss';
                card.appendChild(hint);
            }

            overlay.appendChild(card);

            overlay.addEventListener('click', function() {
                dismissPopup(popup.id);
            });

            return overlay;
        }

        function showNextPopup() {
            if (popupActive || popupQueue.length === 0) return;
            popupActive = true;
            const popup = popupQueue.shift();
            const container = document.getElementById('popup-container');
            if (!container) { popupActive = false; return; }
            const el = createPopupEl(popup);
            container.appendChild(el);
            el.offsetHeight;
            el.classList.add('visible');
            if (!popup.keep) {
                popupTimers[popup.id] = setTimeout(function() {
                    dismissPopup(popup.id);
                }, DISMISS_MS);
            }
        }

        function dismissPopup(id) {
            const container = document.getElementById('popup-container');
            if (!container) return;
            const el = container.querySelector('[data-popup-id="' + id + '"]');
            if (!el) return;
            if (popupTimers[id]) {
                clearTimeout(popupTimers[id]);
                delete popupTimers[id];
            }
            el.classList.remove('visible');
            el.classList.add('hiding');
            setTimeout(function() {
                if (el.parentNode) el.parentNode.removeChild(el);
                popupActive = false;
                showNextPopup();
            }, 300);
        }

        function pollPopups() {
            fetch('/api/popup/poll')
                .then(function(r) { return r.json(); })
                .then(function(popups) {
                    if (!window.active) return;
                    if (!popups || popups.length === 0) return;
                    for (var i = 0; i < popups.length; i++) {
                        popupQueue.push(popups[i]);
                    }
                    showNextPopup();
                })
                .catch(function() {});
        }

        function startPolling() {
            if (pollInterval) return;
            pollInterval = setInterval(pollPopups, POLL_MS);
        }

        function stopPolling() {
            if (pollInterval) {
                clearInterval(pollInterval);
                pollInterval = null;
            }
            Object.keys(popupTimers).forEach(function(id) {
                clearTimeout(popupTimers[id]);
                delete popupTimers[id];
            });
            popupQueue = [];
            popupActive = false;
            var container = document.getElementById('popup-container');
            if (container) container.innerHTML = '';
        }

        document.addEventListener('DOMContentLoaded', startPolling);

        window.addEventListener('beforeunload', stopPolling);
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) stopPolling();
            else startPolling();
        });
    })();
    </script>
</body>
