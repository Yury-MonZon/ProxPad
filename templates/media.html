<!DOCTYPE html>
<script>
function zeroLeakCleanup() {
    document.querySelectorAll('style[data-dynamic], link[data-dynamic], script[data-dynamic], button[data-dynamic], li[data-dynamic], .overlay[data-dynamic], .modal[data-dynamic]').forEach(el => {
        if (el.parentNode) el.parentNode.removeChild(el);
    });
    if (typeof mediaActive !== 'undefined') mediaActive = false;
}
window.addEventListener('beforeunload', zeroLeakCleanup);
document.addEventListener('visibilitychange', function() {
    if (document.hidden) zeroLeakCleanup();
});
</script>
<script>
// --- Leak Prevention: Cancel async operations and timeouts on unload ---
let mediaActive = true;
window.addEventListener('beforeunload', () => { mediaActive = false; });
// Example usage for fetch:
// fetch(`/media_control/${action}`, {...}).then(resp => { if (!mediaActive) return; /* handle resp */ });
// For timeouts, store references and clear them on unload if needed.
</script>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sound Controls</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Colors */
    :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2d2d2d;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --button-bg: #404040;
            --button-hover: #505050;
            --button-border: #555555;
            
            /* Catppuccin colors for specific button groups */
            --play-bg: #a6e3a1;
            --play-border: #94d393;
            --play-text: #1a1a1a;
            
            --volume-bg: #89b4fa;
            --volume-border: #74a0f7;
            --volume-text: #1a1a1a;
            
            --launch-bg: #f38ba8;
            --launch-border: #f078a4;
            --launch-text: #1a1a1a;
            --tabbar-height: 72px;
        }

        html, body {
            margin: 0;
            /* smaller visible bottom reserve so controls sit closer to the tab bar */
            padding: 0 0 8px;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            /* use relative positioning so children aren't clipped */
            position: relative;
            top: 0;
            left: 0;
            box-sizing: border-box;
        }

            .unified-grid {
                width: calc(100% - 8px); /* reduce left/right margins */
                max-width: 100%;
                min-height: calc(100dvh - 8px);
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                grid-auto-rows: minmax(56px, 1fr);
                gap: 6px;
                box-sizing: border-box;
                padding: 0 4px; /* small horizontal padding to decrease large side gaps */
                margin: 0 auto; /* center grid */
                justify-items: stretch;
                align-items: stretch;
            }

        .control-btn {
            border: 1px solid var(--button-border);
            border-radius: 12px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            height: 100%;
            width: 100%;
            min-height: 0;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        }

        /* Reduce horizontal padding for the two left-most media buttons (m1/m2) - stronger selector */
        .unified-grid > button.control-btn.media-btn:nth-child(1),
        .unified-grid > button.control-btn.media-btn:nth-child(2) {
            padding-left: 2px !important;
            padding-right: 2px !important;
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.5);
            filter: brightness(1.15);
        }

        .control-btn:active {
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
        }

        .control-btn i {
            font-size: 1.8rem;
            margin-bottom: 4px;
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.4));
        }

        .control-btn span {
            font-size: 0.75rem;
            font-weight: 600;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
        }

        /* Media control colors */
        .media-btn {
            background: var(--play-bg);
            border-color: var(--play-border);
            color: var(--play-text);
        }

        /* Volume control colors */
        .volume-btn {
            background: var(--volume-bg);
            border-color: var(--volume-border);
            color: var(--volume-text);
        }

        .launch-btn {
            background: var(--launch-bg);
            border-color: var(--launch-border);
            color: var(--launch-text);
        }

        /* Responsive Styles */
        /* Portrait mode optimizations */
        @media (orientation: portrait) {
            .unified-grid {
                padding: 4px;
                gap: 6px;
            }
            
            .control-btn i {
                font-size: 2rem;
            }
            
            .control-btn span {
                font-size: 0.8rem;
            }
            
            .launch-player-btn {
                padding: 12px;
                font-size: 0.95rem;
            }
            
            .launch-player-btn i {
                font-size: 1.7rem;
            }
        }

        /* Landscape mode optimizations */
        @media (orientation: landscape) {
            .unified-grid {
                padding: 2px 4px; /* symmetric tighter gutters */
                gap: 6px;
            }
            
            .control-btn {
                padding: 4px;
            }
            
            .control-btn i {
                font-size: 1.5rem;
            }
            
            .control-btn span {
                font-size: 0.7rem;
            }
            
            .launch-player-btn {
                padding: 6px;
                font-size: 0.8rem;
            }
            
            .launch-player-btn i {
                font-size: 1.3rem;
            }
        }
        @media (max-width: 768px) {
            body {
                padding: 4px;
            }
            
            .unified-grid {
                padding: 2px;
                gap: 6px;
            }
            
            .control-btn {
                padding: 6px;
                min-height: 55px;
            }
            
            .control-btn i {
                font-size: 1.5rem;
            }
            
            .control-btn span {
                font-size: 0.75rem;
            }

            .launch-player-btn {
                min-height: 50px;
                font-size: 0.85rem;
                padding: 8px;
            }

            .launch-player-btn i {
                font-size: 1.3rem;
            }
        }

        @media (max-height: 600px) {
            .unified-grid {
                padding: 5px;
                gap: 6px;
            }
            
            .control-btn {
                min-height: 45px;
                padding: 4px;
            }
            
            .control-btn i {
                font-size: 1.3rem;
                margin-bottom: 2px;
            }
            
            .control-btn span {
                font-size: 0.7rem;
            }
            
            .launch-player-btn {
                padding: 6px;
                min-height: 40px;
                font-size: 0.8rem;
            }

            .launch-player-btn i {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="unified-grid">
        <button class="control-btn media-btn" onclick="mediaControl('previous')">
            <i class="bi bi-skip-backward-fill"></i>
            <span>Previous</span>
        </button>
        <button class="control-btn media-btn" onclick="mediaControl('play_pause')">
            <i class="bi bi-play-circle-fill"></i>
            <span>Play/Pause</span>
        </button>
        <button class="control-btn media-btn" onclick="mediaControl('next')">
            <i class="bi bi-skip-forward-fill"></i>
            <span>Next</span>
        </button>
        <button class="control-btn volume-btn" onclick="mediaControl('volume_down')">
            <i class="bi bi-volume-down-fill"></i>
            <span>Vol Down</span>
        </button>
        <button class="control-btn volume-btn" onclick="mediaControl('mute')">
            <i class="bi bi-volume-mute-fill"></i>
            <span>Mute</span>
        </button>
        <button class="control-btn volume-btn" onclick="mediaControl('volume_up')">
            <i class="bi bi-volume-up-fill"></i>
            <span>Vol Up</span>
        </button>
        <button class="control-btn launch-btn" style="grid-column: 1 / span 3;" onclick="launchMusicPlayer()">
            {% if config.MUSIC_PLAYER_ICON %}
                <img src="{{ config.MUSIC_PLAYER_ICON }}" alt="Music Player" style="height:2.2rem; width:auto; margin-bottom:4px; filter:drop-shadow(2px 2px 4px rgba(0,0,0,0.3));">
            {% else %}
                <i class="bi bi-music-player"></i>
            {% endif %}
            <span>Launch Player</span>
        </button>
    </div>
    <!-- Output Display -->
    <div class="media-output" id="mediaOutput">
        <button class="close-btn" onclick="closeMediaOutput()">&times;</button>
        <pre id="mediaOutputContent"></pre>
    </div>

    <style>
        .media-output {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--button-border);
            border-radius: 10px;
            padding: 16px 32px 16px 16px;
            max-width: 350px;
            z-index: 1000;
            color: var(--text-primary);
            font-size: 1rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            display: none;
        }
        .media-output.show {
            display: block;
        }
        .media-output .close-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
        }
        .media-output pre {
            margin: 0;
            white-space: pre-wrap;
            font-family: inherit;
        }
    </style>
    <script>
        function showMediaOutput(msg, success=true) {
            const outputDiv = document.getElementById('mediaOutput');
            const contentPre = document.getElementById('mediaOutputContent');
            contentPre.textContent = msg;
            outputDiv.classList.add('show');
            outputDiv.style.borderColor = success ? '#a6e3a1' : '#f38ba8';
            setTimeout(() => {
                outputDiv.classList.remove('show');
            }, 5000);
        }
        function closeMediaOutput() {
            document.getElementById('mediaOutput').classList.remove('show');
        }
        function mediaControl(action) {
            fetch(`/media_control/${action}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (!mediaActive) return;
                if (data.success) {
                    showMediaOutput(`Media ${action} command sent successfully`, true);
                } else {
                    showMediaOutput('Failed: ' + (data.error || 'Unknown error'), false);
                }
            })
            .catch(error => {
                if (!mediaActive) return;
                showMediaOutput('Error: ' + error, false);
            });
        }
        function launchMusicPlayer() {
            fetch('/launch_music_player', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                if (!mediaActive) return;
                if (data.success) {
                    showMediaOutput(`Music player ${data.player} launched successfully`, true);
                } else {
                    showMediaOutput('Failed: ' + (data.error || 'Unknown error'), false);
                }
            })
            .catch(error => {
                if (!mediaActive) return;
                showMediaOutput('Error: ' + error, false);
            });
        }
    </script>
    <script>
    window.addEventListener('message', e => {
        if (e.data === 'proxpad-pause') {
            mediaActive = false;
        }
    });
    </script>
    <script>
        // notify parent of activity to reset screensaver
        function postActivity(){ try{ parent.postMessage('proxpad-activity', '*'); }catch(e){} }
        ['click','touchstart','keydown','mousemove'].forEach(e=>window.addEventListener(e, postActivity, {passive:true}));
        window.addEventListener('load', postActivity);
    </script>
    <script>
    // Signal parent to vibrate on control taps
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.control-btn, button.control-btn, .nav-link, button.nav-link').forEach(b=>{
            b.addEventListener('pointerdown',(ev)=>{ try{ if (ev && ev.pointerType==='touch') parent.postMessage({ proxpad: 'button-press' }, '*'); }catch(e){} }, {passive:true});
        });
    });
    </script>
</body>
</html>
